<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050507">
<title>КиноПоток TV — FM-DB Edition</title>
<style>
:root{
    --bg: #050507;
    --glass-1: rgba(255,255,255,0.04);
    --glass-2: rgba(255,255,255,0.08);
    --glass-3: rgba(255,255,255,0.14);
    --border-1: rgba(255,255,255,0.08);
    --border-2: rgba(255,255,255,0.16);
    --border-3: rgba(255,255,255,0.28);
    --text-1: #ffffff;
    --text-2: rgba(255,255,255,0.72);
    --text-3: rgba(255,255,255,0.45);
    --accent-1: #8b5cf6;
    --accent-2: #06b6d4;
    --gold: #fbbf24;
    --shadow-md: 0 4px 16px rgba(0,0,0,0.5), 0 12px 40px rgba(0,0,0,0.35);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.6), 0 24px 64px rgba(0,0,0,0.45);
    --shadow-focus: 0 0 0 4px rgba(139,92,246,0.9), 0 0 40px rgba(139,92,246,0.8), 0 12px 48px rgba(0,0,0,0.6);
    --shadow-inner: inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -1px 0 rgba(0,0,0,0.25);
    --blur-md: blur(24px) saturate(180%);
    --blur-lg: blur(40px) saturate(200%);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text-1);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"SF Pro Display",sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
.bg-layer{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 15% 15%, #150e2a 0%, #050507 55%),radial-gradient(ellipse at 85% 85%, #06181f 0%, transparent 55%)}
.bg-noise{position:absolute;inset:0;opacity:0.04;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");pointer-events:none}
.bg-orb{position:absolute;border-radius:50%;filter:blur(120px);opacity:0.5;will-change:transform}
.bg-orb-1{width:600px;height:600px;top:-180px;right:-150px;background:radial-gradient(circle,#8b5cf6 0%,transparent 70%);animation:fA 30s infinite ease-in-out}
.bg-orb-2{width:500px;height:500px;bottom:-150px;left:-150px;background:radial-gradient(circle,#06b6d4 0%,transparent 70%);animation:fB 36s infinite ease-in-out;animation-delay:-10s}
@keyframes fA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-60px,80px) scale(1.2)}}
@keyframes fB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(80px,-60px) scale(1.15)}}

/* SPLASH */
.splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at 50% 40%,#1a1230 0%,#050507 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;transition:opacity 0.9s var(--ease),visibility 0.9s}
.splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{width:180px;height:180px;border-radius:52px;background:linear-gradient(135deg,rgba(139,92,246,0.35),rgba(6,182,212,0.2));backdrop-filter:var(--blur-lg);border:1px solid var(--border-3);box-shadow:0 0 80px rgba(139,92,246,0.5),var(--shadow-inner);display:flex;align-items:center;justify-content:center;font-size:84px;position:relative;overflow:hidden;animation:lP 2.4s ease-in-out infinite}
.splash-logo::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent 40%,rgba(255,255,255,0.4) 50%,transparent 60%);animation:shine 2.8s infinite}
@keyframes lP{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes shine{0%{transform:translate(-100%,-100%) rotate(45deg)}100%{transform:translate(100%,100%) rotate(45deg)}}
.splash-title{font-size:56px;font-weight:900;letter-spacing:-2px;background:linear-gradient(135deg,#fff 0%,#c4b5fd 50%,#67e8f9 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;opacity:0;animation:fUp 0.9s 0.3s forwards var(--ease)}
.splash-sub{font-size:16px;color:var(--text-3);letter-spacing:8px;text-transform:uppercase;font-weight:600;opacity:0;animation:fUp 0.9s 0.5s forwards var(--ease)}
.splash-loader{width:80px;height:4px;border-radius:2px;background:rgba(255,255,255,0.08);overflow:hidden;margin-top:20px;opacity:0;animation:fUp 0.9s 0.7s forwards var(--ease)}
.splash-loader::before{content:'';display:block;width:40%;height:100%;background:linear-gradient(90deg,var(--accent-1),var(--accent-2));border-radius:2px;animation:lB 1.6s infinite ease-in-out}
@keyframes lB{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@keyframes fUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

/* CONTAINER */
.tv-container{position:relative;width:100vw;height:100vh;z-index:10;opacity:0;transform:scale(0.98);transition:opacity 0.8s var(--ease),transform 0.8s var(--ease);display:flex;flex-direction:column;overflow:hidden}
.tv-container.visible{opacity:1;transform:scale(1)}

/* TOP BAR */
.top-bar{position:absolute;top:0;left:0;right:0;z-index:100;padding:24px 56px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to bottom,rgba(5,5,7,0.9) 0%,rgba(5,5,7,0.4) 60%,transparent 100%);transition:all 0.5s var(--ease)}
.top-bar.scrolled{background:linear-gradient(to bottom,rgba(5,5,7,0.98) 0%,rgba(5,5,7,0.85) 100%);backdrop-filter:var(--blur-lg);border-bottom:1px solid var(--border-1)}
.brand{display:flex;align-items:center;gap:16px}
.brand-logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,rgba(139,92,246,0.4),rgba(6,182,212,0.25));backdrop-filter:var(--blur-md);border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 0 24px rgba(139,92,246,0.4),var(--shadow-inner)}
.brand-name{font-size:26px;font-weight:800;letter-spacing:-0.8px;background:linear-gradient(135deg,#fff 0%,#c4b5fd 60%,#67e8f9 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.top-nav{display:flex;gap:6px;align-items:center}
.nav-item{padding:12px 22px;border-radius:14px;background:transparent;border:2px solid transparent;color:var(--text-3);font-size:16px;font-weight:600;cursor:pointer;transition:all 0.3s var(--ease);letter-spacing:0.2px;outline:none;font-family:inherit;position:relative}
.nav-item:hover,.nav-item.focused{color:var(--text-1);background:var(--glass-2)}
.nav-item.focused{transform:scale(1.05);box-shadow:var(--shadow-focus)}
.nav-item.active{color:var(--text-1);background:var(--glass-3);box-shadow:var(--shadow-md),var(--shadow-inner)}
.top-right{display:flex;gap:14px;align-items:center}
.icon-btn{width:52px;height:52px;border-radius:50%;background:linear-gradient(180deg,var(--glass-2) 0%,var(--glass-1) 100%);backdrop-filter:var(--blur-md);border:1px solid var(--border-2);color:var(--text-1);font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s var(--ease);box-shadow:var(--shadow-md),var(--shadow-inner);outline:none;font-family:inherit}
.icon-btn:hover,.icon-btn.focused{transform:scale(1.08);box-shadow:var(--shadow-focus)}

/* CONTENT */
.content{flex:1;position:relative;overflow:hidden;z-index:15}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;opacity:0;transform:translateX(60px);transition:opacity 0.55s var(--ease),transform 0.55s var(--ease);pointer-events:none;padding-bottom:80px}
.page.active{opacity:1;transform:translateX(0);pointer-events:auto}
.page.exit-left{opacity:0;transform:translateX(-60px)}
.page.exit-right{opacity:0;transform:translateX(60px)}
.page::-webkit-scrollbar{width:8px}
.page::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:4px}

/* HERO */
.hero{position:relative;width:100%;height:70vh;min-height:540px;overflow:hidden;margin-bottom:-120px}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.05);transition:transform 1.2s var(--ease),opacity 0.8s;opacity:0}
.hero-bg.loaded{opacity:1;transform:scale(1)}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,5,7,0.5) 0%,transparent 30%,rgba(5,5,7,0.4) 65%,rgba(5,5,7,0.98) 100%),linear-gradient(to right,rgba(5,5,7,0.85) 0%,rgba(5,5,7,0.4) 40%,transparent 75%)}
.hero-content{position:absolute;bottom:180px;left:64px;right:64px;z-index:5;max-width:720px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:20px;background:linear-gradient(180deg,var(--glass-2) 0%,var(--glass-1) 100%);backdrop-filter:var(--blur-md);border:1px solid var(--border-2);box-shadow:var(--shadow-md);font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:20px}
.hero-badge .dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--accent-3),var(--accent-1));box-shadow:0 0 12px var(--accent-3)}
.hero-title{font-size:72px;font-weight:900;letter-spacing:-2.5px;line-height:1.02;margin-bottom:20px;background:linear-gradient(135deg,#fff 0%,#e9d5ff 55%,#a5f3fc 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 8px 40px rgba(139,92,246,0.5))}
.hero-meta{display:flex;gap:14px;align-items:center;margin-bottom:24px;font-size:16px;color:var(--text-2);font-weight:500}
.hero-meta .rating{color:var(--gold);font-weight:800;font-size:18px}
.hero-desc{font-size:18px;line-height:1.6;color:var(--text-2);margin-bottom:36px;max-width:620px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-actions{display:flex;gap:16px}
.btn-play{padding:18px 42px;border-radius:18px;background:linear-gradient(135deg,var(--accent-1) 0%,var(--accent-2) 100%);border:1px solid rgba(255,255,255,0.25);color:#fff;font-size:18px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:12px;box-shadow:0 12px 48px rgba(139,92,246,0.6),0 4px 12px rgba(0,0,0,0.4),0 1px 0 rgba(255,255,255,0.3) inset;transition:all 0.3s var(--ease);letter-spacing:0.3px;font-family:inherit;outline:none}
.btn-play:hover,.btn-play.focused{transform:scale(1.06);box-shadow:0 0 0 4px rgba(139,92,246,0.9),0 0 50px rgba(139,92,246,0.9),0 16px 60px rgba(0,0,0,0.6)}
.btn-ghost{padding:18px 32px;border-radius:18px;background:linear-gradient(180deg,var(--glass-2) 0%,var(--glass-1) 100%);backdrop-filter:var(--blur-md);border:1px solid var(--border-2);color:#fff;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-md),var(--shadow-inner);transition:all 0.3s var(--ease);font-family:inherit;outline:none}
.btn-ghost:hover,.btn-ghost.focused{transform:scale(1.06);box-shadow:var(--shadow-focus)}

/* ROWS */
.row-wrap{position:relative;z-index:20;margin-bottom:44px;padding:0 56px}
.row-title{font-size:24px;font-weight:800;letter-spacing:-0.5px;margin-bottom:20px;color:var(--text-1);display:flex;align-items:center;gap:14px}
.row-title::before{content:'';width:5px;height:28px;border-radius:3px;background:linear-gradient(180deg,var(--accent-1),var(--accent-2));box-shadow:0 0 16px rgba(139,92,246,0.6)}
.row-scroll{display:flex;gap:20px;overflow-x:auto;overflow-y:visible;padding:24px 8px;margin:-24px -8px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.row-scroll::-webkit-scrollbar{display:none}

/* CARD */
.tv-card{flex:0 0 220px;aspect-ratio:2/3;border-radius:22px;overflow:hidden;background:var(--glass-1);border:1px solid var(--border-1);box-shadow:var(--shadow-md);transition:all 0.4s var(--ease);cursor:pointer;position:relative;transform-origin:center center;outline:none;scroll-snap-align:start}
.tv-card .movie-poster{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity 0.6s,transform 0.6s var(--ease)}
.tv-card .movie-poster.loaded{opacity:1}
.tv-card:hover,.tv-card.focused{transform:scale(1.12) translateY(-6px);box-shadow:var(--shadow-focus);z-index:50;border-color:rgba(139,92,246,0.6)}
.tv-card:hover .movie-poster,.tv-card.focused .movie-poster{transform:scale(1.06)}
.tv-card::after{content:'';position:absolute;inset:0;border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.15);pointer-events:none;z-index:2}
.tv-card-overlay{position:absolute;bottom:0;left:0;right:0;padding:36px 16px 16px;background:linear-gradient(to top,rgba(0,0,0,0.95) 0%,rgba(0,0,0,0.6) 50%,transparent 100%);pointer-events:none;z-index:3}
.tv-card-title{font-size:16px;font-weight:800;color:#fff;margin-bottom:6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-0.3px}
.tv-card-meta{display:flex;justify-content:space-between;font-size:13px;color:rgba(255,255,255,0.8);font-weight:600}
.tv-card-rating{color:var(--gold);font-weight:800}

/* SKELETONS */
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk{background:linear-gradient(90deg,rgba(255,255,255,0.03) 25%,rgba(255,255,255,0.09) 50%,rgba(255,255,255,0.03) 75%);background-size:200% 100%;animation:sk 1.8s infinite;border:1px solid var(--border-1);border-radius:22px;aspect-ratio:2/3;flex:0 0 220px}

/* SEARCH */
.search-overlay{position:fixed;inset:0;z-index:500;background:rgba(5,5,7,0.85);backdrop-filter:var(--blur-lg);display:flex;flex-direction:column;align-items:center;padding:80px 10vw 40px;opacity:0;pointer-events:none;transition:opacity 0.4s var(--ease)}
.search-overlay.open{opacity:1;pointer-events:auto}
.search-input-wrap{width:100%;max-width:900px;position:relative;margin-bottom:40px}
.search-input{width:100%;padding:26px 90px 26px 40px;border-radius:24px;background:linear-gradient(180deg,var(--glass-2) 0%,var(--glass-1) 100%);border:2px solid var(--border-2);color:#fff;font-size:24px;font-weight:600;outline:none;font-family:inherit;box-shadow:var(--shadow-lg),var(--shadow-inner);transition:all 0.3s var(--ease);letter-spacing:-0.3px}
.search-input::placeholder{color:var(--text-3)}
.search-input:focus{border-color:var(--accent-1);box-shadow:0 0 0 4px rgba(139,92,246,0.3),0 0 60px rgba(139,92,246,0.4),var(--shadow-lg)}
.search-input-icon{position:absolute;left:20px;top:50%;transform:translateY(-50%);font-size:26px;color:var(--text-3);pointer-events:none}
.search-close{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:var(--glass-2);border:1px solid var(--border-2);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.3s var(--ease)}
.search-close:hover,.search-close.focused{background:var(--glass-3);transform:translateY(-50%) scale(1.1);box-shadow:var(--shadow-focus)}
.search-results{width:100%;max-width:1400px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px;overflow-y:auto;padding:24px 0}
.search-results .tv-card{flex:none;width:100%}

/* DETAIL */
.detail-screen{position:fixed;inset:0;z-index:400;background:rgba(5,5,7,0.6);backdrop-filter:var(--blur-lg);overflow-y:auto;overflow-x:hidden;opacity:0;pointer-events:none;transition:opacity 0.55s var(--ease);padding-bottom:120px}
.detail-screen.open{opacity:1;pointer-events:auto}
.detail-hero{position:relative;width:100%;height:80vh;min-height:600px;overflow:hidden}
.detail-hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.05);transition:transform 1.2s var(--ease);opacity:0}
.detail-hero-bg.loaded{opacity:1;transform:scale(1)}
.detail-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,5,7,0.5) 0%,transparent 30%,rgba(5,5,7,0.6) 65%,rgba(5,5,7,0.99) 100%),linear-gradient(to right,rgba(5,5,7,0.9) 0%,rgba(5,5,7,0.4) 45%,transparent 80%)}
.detail-hero-content{position:absolute;bottom:80px;left:64px;right:64px;z-index:5;max-width:800px}
.detail-title{font-size:64px;font-weight:900;letter-spacing:-2px;line-height:1.05;margin-bottom:24px;background:linear-gradient(135deg,#fff 0%,#e9d5ff 60%,#a5f3fc 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 8px 40px rgba(139,92,246,0.5))}
.detail-meta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.detail-chip{padding:10px 20px;border-radius:16px;background:linear-gradient(180deg,var(--glass-2) 0%,var(--glass-1) 100%);backdrop-filter:var(--blur-md);border:1px solid var(--border-2);box-shadow:var(--shadow-md),var(--shadow-inner);font-size:14px;font-weight:700;color:var(--text-2);letter-spacing:0.3px}
.detail-chip.rating{color:var(--gold)}
.detail-chip.hd{border:1px solid var(--border-3);color:#fff;letter-spacing:1.5px}
.detail-actions{display:flex;gap:16px;margin-bottom:8px}
.detail-body{padding:0 64px 80px;max-width:1400px;margin:0 auto}
.detail-section-title{font-size:22px;font-weight:800;margin:48px 0 20px;color:var(--text-1);display:flex;align-items:center;gap:14px;letter-spacing:-0.4px}
.detail-section-title::before{content:'';width:5px;height:26px;border-radius:3px;background:linear-gradient(180deg,var(--accent-1),var(--accent-2));box-shadow:0 0 16px rgba(139,92,246,0.6)}
.detail-desc{font-size:19px;line-height:1.65;color:var(--text-2);max-width:1000px}
.trailer-container{position:relative;width:100%;max-width:1200px;aspect-ratio:16/9;border-radius:24px;overflow:hidden;background:#000;border:1px solid var(--border-2);box-shadow:var(--shadow-lg),var(--shadow-inner)}
.trailer-container iframe{width:100%;height:100%;border:0}
.cast-row{display:flex;gap:24px;overflow-x:auto;padding:24px 8px;margin:-24px -8px;scrollbar-width:none;scroll-behavior:smooth}
.cast-row::-webkit-scrollbar{display:none}
.cast-card{flex:0 0 160px;text-align:center;outline:none;transition:transform 0.3s var(--ease);padding:8px;border-radius:20px}
.cast-card:hover,.cast-card.focused{transform:scale(1.08);background:var(--glass-1);box-shadow:var(--shadow-focus)}
.cast-avatar{width:140px;height:140px;border-radius:50%;background:linear-gradient(135deg,#3a2a5a,#1a1a2a);margin-bottom:14px;border:2px solid var(--border-2);box-shadow:var(--shadow-md),0 0 0 1px rgba(255,255,255,0.05) inset;overflow:hidden;margin-left:auto;margin-right:auto}
.cast-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.cast-name{font-size:15px;font-weight:700;color:var(--text-1);margin-bottom:4px}
.cast-role{font-size:13px;color:var(--text-3)}
.back-btn{position:fixed;top:36px;left:36px;z-index:420;width:60px;height:60px;border-radius:50%;background:rgba(10,10,15,0.75);backdrop-filter:var(--blur-lg);border:1px solid var(--border-2);box-shadow:var(--shadow-lg),var(--shadow-inner);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s var(--ease);outline:none;font-family:inherit}
.back-btn:hover,.back-btn.focused{transform:scale(1.1);box-shadow:var(--shadow-focus)}

/* PLAYER */
.player-screen{position:fixed;inset:0;z-index:600;background:#000;opacity:0;pointer-events:none;transition:opacity 0.5s var(--ease);display:flex;flex-direction:column}
.player-screen.open{opacity:1;pointer-events:auto}
.player-top{padding:32px 56px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to bottom,rgba(0,0,0,0.9),transparent);position:absolute;top:0;left:0;right:0;z-index:10}
.player-title{font-size:22px;font-weight:800;color:#fff;letter-spacing:-0.3px}
.player-close{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.12);backdrop-filter:var(--blur-md);border:1px solid var(--border-2);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s var(--ease);outline:none;font-family:inherit}
.player-close:hover,.player-close.focused{transform:scale(1.1);box-shadow:var(--shadow-focus)}
.player-video{flex:1;display:flex;align-items:center;justify-content:center;background:#000}
.player-video iframe{width:100%;height:100%;border:0}
.player-bottom{padding:40px 56px;background:linear-gradient(to top,rgba(0,0,0,0.95),transparent);position:absolute;bottom:0;left:0;right:0;z-index:10}
.player-progress{width:100%;height:6px;background:rgba(255,255,255,0.15);border-radius:3px;margin-bottom:28px;overflow:hidden;position:relative}

<script>
(function(){
// ==================================================================
// FM-DB API CONFIG (бесплатный, без ключей)
// ==================================================================
const FMDB_BASE = 'https://imdb.iamidiotareyoutoo.com';
// Опциональный fallback на TMDB, если FM-DB отвалится
const USE_TMDB_FALLBACK = true;
const TMDB_API_KEY = 'YOUR_API_KEY_HERE'; // нужен только если USE_TMDB_FALLBACK = true
const TMDB_BASE = 'https://api.themoviedb.org/3';
const IMG_BASE_TMDB = 'https://image.tmdb.org/t/p/';

// ==================================================================
// CACHE
// ==================================================================
const Cache = {
    set(k, d){ try{ localStorage.setItem('kptv_fmdb_'+k, JSON.stringify({d, t: Date.now()})); }catch(e){} },
    get(k){
        try{
            const raw = localStorage.getItem('kptv_fmdb_'+k);
            if(!raw) return null;
            const {d, t} = JSON.parse(raw);
            if(Date.now() - t > 1000*60*30){ localStorage.removeItem('kptv_fmdb_'+k); return null; }
            return d;
        }catch(e){ return null; }
    }
};

// ==================================================================
// FM-DB CLIENT
// ==================================================================
async function fmdbRequest(path, params = {}, useCache = true){
    const q = new URLSearchParams(params).toString();
    const key = path + '?' + q;
    if(useCache){ const c = Cache.get(key); if(c) return c; }
    const url = `${FMDB_BASE}${path}${q ? '?' + q : ''}`;
    const r = await fetch(url);
    if(!r.ok) throw new Error('FM-DB ' + r.status);
    const data = await r.json();
    Cache.set(key, data);
    return data;
}

// Поиск: FM-DB возвращает {ok, description:[{#TITLE, #YEAR, #IMDB_ID, #RANK, #ACTORS, #AKA, #IMDB_URL, #IMDB_IV, #IMG_POSTER, photo_width, photo_height}]}
async function fmdbSearch(query){
    const data = await fmdbRequest('/search', { q: query });
    if(!data.ok || !data.description) return [];
    return data.description.map(item => ({
        imdb_id: item['#IMDB_ID'],
        title: item['#TITLE'],
        year: item['#YEAR'],
        rank: item['#RANK'],
        actors: item['#ACTORS'],
        aka: item['#AKA'],
        poster: item['#IMG_POSTER'],
        poster_width: item.photo_width,
        poster_height: item.photo_height,
        imdb_url: item['#IMDB_URL']
    })).filter(m => m.imdb_id && m.title);
}

// Детали (опционально, если нужно)
async function fmdbDetails(imdbId){
    return fmdbRequest('/search', { tt: imdbId });
}

// ==================================================================
// TMDB FALLBACK (опционально)
// ==================================================================
async function tmdbFallback(query){
    if(!USE_TMDB_FALLBACK || TMDB_API_KEY === 'YOUR_API_KEY_HERE') return [];
    try {
        const r = await fetch(`${TMDB_BASE}/search/movie?api_key=${TMDB_API_KEY}&language=ru-RU&query=${encodeURIComponent(query)}`);
        const d = await r.json();
        return (d.results || []).map(m => ({
            imdb_id: 'tmdb_' + m.id,
            title: m.title || m.name,
            year: (m.release_date || '').slice(0,4),
            rank: '',
            actors: '',
            poster: m.poster_path ? `${IMG_BASE_TMDB}w500${m.poster_path}` : null,
            poster_width: 500,
            poster_height: 750,
            _tmdb: true,
            _tmdb_id: m.id
        }));
    } catch(e){ return []; }
}

// ==================================================================
// SPATIAL NAVIGATION (D-pad)
// ==================================================================
const Focus = {
    current: null,
    set(el){
        if(this.current === el) return;
        if(this.current) this.current.classList.remove('focused');
        this.current = el;
        if(el){ el.classList.add('focused'); el.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'}); }
    },
    all(){
        return Array.from(document.querySelectorAll('.nav-item:not([style*="display: none"]), .icon-btn, .tv-card, .btn-play, .btn-ghost, .cast-card, .back-btn, .player-btn, .player-close, .search-close'))
            .filter(el => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0 && window.getComputedStyle(el).visibility !== 'hidden'; });
    },
    move(dir){
        const all = this.all();
        if(!all.length) return;
        if(!this.current){ this.set(all[0]); return; }
        const cur = this.current.getBoundingClientRect();
        const cx = cur.left + cur.width/2, cy = cur.top + cur.height/2;
        let best = null, bestScore = Infinity;
        all.forEach(el => {
            if(el === this.current) return;
            const r = el.getBoundingClientRect();
            const ex = r.left + r.width/2, ey = r.top + r.height/2;
            const dx = ex - cx, dy = ey - cy;
            let valid = false, primary = 0, secondary = 0;
            if(dir === 'left'  && dx < -10){ valid = true; primary = -dx; secondary = Math.abs(dy); }
            if(dir === 'right' && dx > 10) { valid = true; primary = dx;  secondary = Math.abs(dy); }
            if(dir === 'up'    && dy < -10){ valid = true; primary = -dy; secondary = Math.abs(dx); }
            if(dir === 'down'  && dy > 10) { valid = true; primary = dy;  secondary = Math.abs(dx); }
            if(valid){ const score = primary + secondary * 2; if(score < bestScore){ bestScore = score; best = el; } }
        });
        if(best) this.set(best);
    }
};

// ==================================================================
// SPLASH
// ==================================================================
const splash = document.getElementById('splash');
const app = document.getElementById('app');
window.addEventListener('load', () => {
    setTimeout(() => {
        splash.classList.add('hidden');
        app.classList.add('visible');
        loadAll();
        setTimeout(() => { const f = document.querySelector('.nav-item.active'); if(f) Focus.set(f); }, 400);
    }, 2200);
});

// ==================================================================
// KEYBOARD
// ==================================================================
document.addEventListener('keydown', (e) => {
    const detailOpen = document.getElementById('detailScreen').classList.contains('open');
    const playerOpen = document.getElementById('playerScreen').classList.contains('open');
    const searchOpen = document.getElementById('searchOverlay').classList.contains('open');
    if(e.key === 'Escape' || e.key === 'Backspace'){
        e.preventDefault();
        if(playerOpen) closePlayer();
        else if(searchOpen) closeSearch();
        else if(detailOpen) closeDetail();
        return;
    }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); Focus.move('left'); return; }
    if(e.key === 'ArrowRight'){ e.preventDefault(); Focus.move('right'); return; }
    if(e.key === 'ArrowUp'){ e.preventDefault(); Focus.move('up'); return; }
    if(e.key === 'ArrowDown'){ e.preventDefault(); Focus.move('down'); return; }
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); if(Focus.current) Focus.current.click(); }
});

// ==================================================================
// NAV
// ==================================================================
const navItems = document.querySelectorAll('.nav-item');
const pages = {
    home: document.getElementById('page-home'),
    movies: document.getElementById('page-movies'),
    series: document.getElementById('page-series'),
    top: document.getElementById('page-top'),
    my: document.getElementById('page-my')
};
let currentPage = 'home';
function switchPage(id){
    if(id === currentPage) return;
    navItems.forEach(n => n.classList.toggle('active', n.dataset.page === id));
    const old = pages[currentPage];
    old.classList.remove('active'); old.classList.add('exit-left');
    setTimeout(() => old.classList.remove('exit-left'), 550);
    const nw = pages[id]; nw.classList.add('active'); nw.scrollTop = 0;
    currentPage = id;
}
navItems.forEach(n => {
    n.addEventListener('click', () => switchPage(n.dataset.page));
    n.addEventListener('mouseenter', () => Focus.set(n));
});

// ==================================================================
// CARD FACTORY (работает и для FM-DB и для TMDB)
// ==================================================================
const FALLBACK = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1a2e"/><stop offset="1" stop-color="#050507"/></linearGradient></defs><rect fill="url(#g)" width="300" height="450"/><text x="50%" y="50%" fill="#333" text-anchor="middle" dominant-baseline="middle" font-size="70">🎬</text></svg>');

function createCard(m){
    const div = document.createElement('div');
    div.className = 'tv-card';
    div.tabIndex = 0;
    const poster = m.poster ? m.poster : FALLBACK;
    const year = m.year || '';
    const rating = m.rank || m._tmdb ? (m.vote_average ? m.vote_average.toFixed(1) : '—') : '—';
    const title = m.title || '—';
    div.innerHTML = `
        <img class="movie-poster" src="${poster}" alt="${title}" loading="lazy" onerror="this.src='${FALLBACK}'">
        <div class="tv-card-overlay">
            <div class="tv-card-title">${title}</div>
            <div class="tv-card-meta"><span>${year}</span><span class="tv-card-rating">${m.rank ? '#'+m.rank : (rating !== '—' ? '★ '+rating : '')}</span></div>
        </div>
    `;
    const img = div.querySelector('img');
    img.onload = () => img.classList.add('loaded');
    if(img.complete) img.classList.add('loaded');
    div.addEventListener('click', () => openDetail(m));
    div.addEventListener('mouseenter', () => Focus.set(div));
    div.addEventListener('focus', () => Focus.set(div));
    return div;
}

function fillRow(id, items){
    const el = document.getElementById(id);
    if(!el) return;
    el.innerHTML = '';
    if(!items || !items.length){ el.innerHTML = '<div style="color:#444;font-size:16px;padding:20px">Нет данных</div>'; return; }
    items.forEach(m => el.appendChild(createCard(m)));
}

// ==================================================================
// LOAD ALL
// ==================================================================
async function loadAll(){
    try {
        // Тренды (популярные запросы)
        const trending = await fmdbSearch('2024');
        const heroMovie = trending[0];
        if(heroMovie) setHero(heroMovie);
        fillRow('rowTrending', trending.slice(0,15));
        
        // Топ IMDb (по рейтингу — ищем культовые)
        const top = await fmdbSearch('The Godfather');
        fillRow('rowTop', top.slice(0,15));
        fillRow('rowTop250', top.slice(0,20));
        
        // Movies page
        const popular = await fmdbSearch('Marvel');
        fillRow('moviesPopular', popular.slice(0,15));
        fillRow('moviesTop', top.slice(0,15));
        
        // Series page
        const series = await fmdbSearch('Breaking Bad');
        fillRow('seriesPopular', series.slice(0,15));
        
        // Top page
        fillRow('topMovies', top.slice(0,20));
        
        // My page
        fillRow('myFav', popular.slice(0,8));
    } catch(e){
        console.error('FM-DB load error:', e);
        showFallback();
    }
}

function setHero(m){
    document.getElementById('heroTitle').textContent = m.title || '—';
    document.getElementById('heroRating').textContent = m.rank ? `#${m.rank} IMDb` : '★ —';
    document.getElementById('heroYear').textContent = m.year || '—';
    document.getElementById('heroDesc').textContent = m.actors ? `В ролях: ${m.actors}` : 'Описание доступно на IMDb';
    const bg = document.getElementById('heroBg');
    bg.style.backgroundImage = `url(${m.poster || FALLBACK})`;
    setTimeout(() => bg.classList.add('loaded'), 100);
    document.getElementById('heroWatch').onclick = () => openDetailAndPlay(m);
    document.getElementById('heroMore').onclick = () => openDetail(m);
}

function showFallback(){
    document.querySelectorAll('.sk').forEach(el => {
        el.style.background = 'rgba(255,255,255,0.03)';
        el.style.animation = 'none';
        el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#333;font-size:40px">🎬</div>';
    });
    document.getElementById('heroTitle').textContent = 'FM-DB недоступен';
    document.getElementById('heroDesc').textContent = 'Проверь подключение к интернету. API: imdb.iamidiotareyoutoo.com';
}

// ==================================================================
// DETAIL
// ==================================================================
const detailScreen = document.getElementById('detailScreen');
const detailHeroBg = document.getElementById('detailHeroBg');
let currentMovie = null;

async function openDetail(m){
    currentMovie = m;
    detailScreen.classList.add('open');
    document.getElementById('detailTitle').textContent = m.title || '—';
    document.getElementById('detailRating').textContent = m.rank ? `#${m.rank} IMDb` : '★ —';
    document.getElementById('detailYear').textContent = m.year || '—';
    document.getElementById('detailGenre').textContent = m.aka || '—';
    document.getElementById('detailDesc').textContent = m.actors ? `В ролях: ${m.actors}` : 'Описание доступно на IMDb: ' + (m.imdb_url || '');
    document.getElementById('trailerContainer').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#555;font-size:16px">Трейлеры доступны на IMDb</div>';
    document.getElementById('castList').innerHTML = '';
    
    detailHeroBg.classList.remove('loaded');
    detailHeroBg.style.backgroundImage = `url(${m.poster || FALLBACK})`;
    setTimeout(() => detailHeroBg.classList.add('loaded'), 100);
    
    setTimeout(() => Focus.set(document.getElementById('detailWatch')), 400);
    
    // Пытаемся получить детали из FM-DB
    if(m.imdb_id && !m._tmdb){
        try {
            const details = await fmdbDetails(m.imdb_id);
            if(details.ok && details.description && details.description[0]){
                const d = details.description[0];
                if(d['#ACTORS']) document.getElementById('detailDesc').textContent = `В ролях: ${d['#ACTORS']}`;
            }
        } catch(e){ /* ignore */ }
    }
    
    // Актёры (простые карточки, если есть данные)
    const cast = document.getElementById('castList');
    if(m.actors){
        m.actors.split(',').slice(0,10).forEach(name => {
            const c = document.createElement('div');
            c.className = 'cast-card';
            c.tabIndex = 0;
            c.innerHTML = `<div class="cast-avatar"><div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:52px;color:#444">👤</div></div><div class="cast-name">${name.trim()}</div>`;
            c.addEventListener('mouseenter', () => Focus.set(c));
            c.addEventListener('focus', () => Focus.set(c));
            cast.appendChild(c);
        });
    }
}

function closeDetail(){
    detailScreen.classList.remove('open');
    setTimeout(() => { const nav = document.querySelector('.nav-item.active'); if(nav) Focus.set(nav); }, 300);
}
document.getElementById('detailBack').addEventListener('click', closeDetail);
document.getElementById('detailBack').addEventListener('mouseenter', function(){ Focus.set(this); });

document.getElementById('detailWatch').addEventListener('click', () => openDetailAndPlay(currentMovie));
document.getElementById('detailFav').addEventListener('click', function(){
    this.textContent = this.textContent.includes('♡') ? '♥ В избранном' : '♡ В избранное';
});
['detailWatch','detailFav'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('mouseenter', () => Focus.set(el));
    el.addEventListener('focus', () => Focus.set(el));
});

function openDetailAndPlay(m){
    if(!m) return;
    // FM-DB не даёт прямых ссылок на видео — открываем IMDb страницу
    if(m.imdb_url){
        closeDetail();
        alert('🎬 Открываем IMDb: ' + m.title + '\n\n' + m.imdb_url);
        // window.open(m.imdb_url, '_blank'); // раскомментируй в браузере
    } else {
        alert('Трейлер недоступен');
    }
}

// ==================================================================
// PLAYER (заглушка — FM-DB не даёт видео)
// ==================================================================
const playerScreen = document.getElementById('playerScreen');
const playerVideo = document.getElementById('playerVideo');
const playerTitle = document.getElementById('playerTitle');
const playerProgress = document.getElementById('playerProgress');
const playPauseBtn = document.getElementById('playPauseBtn');
let isPlaying = false, progressVal = 0, progressTimer = null;

function openPlayer(m){
    playerTitle.textContent = m.title || '—';
    playerVideo.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#666;font-size:24px;text-align:center;padding:40px">🎬<br><br>FM-DB не предоставляет<br>прямые ссылки на видео.<br><br>Открой фильм на IMDb:<br><a href="${m.imdb_url}" target="_blank" style="color:#8b5cf6">${m.imdb_url || ''}</a></div>`;
    playerScreen.classList.add('open');
    isPlaying = true;
    playPauseBtn.textContent = '⏸';
    progressVal = 0;
    clearInterval(progressTimer);
    progressTimer = setInterval(() => { if(isPlaying){ progressVal = (progressVal + 0.4) % 100; playerProgress.style.width = progressVal + '%'; } }, 400);
    setTimeout(() => Focus.set(playPauseBtn), 400);
}

function closePlayer(){
    playerScreen.classList.remove('open');
    playerVideo.innerHTML = '';
    clearInterval(progressTimer);
    isPlaying = false;
    setTimeout(() => { const nav = document.querySelector('.nav-item.active'); if(nav) Focus.set(nav); }, 300);
}
document.getElementById('playerClose').addEventListener('click', closePlayer);
document.getElementById('playerClose').addEventListener('mouseenter', function(){ Focus.set(this); });
playPauseBtn.addEventListener('click', () => { isPlaying = !isPlaying; playPauseBtn.textContent = isPlaying ? '⏸' : '▶'; });
playPauseBtn.addEventListener('mouseenter', function(){ Focus.set(this); });
document.getElementById('rewindBtn').addEventListener('click', () => { progressVal = Math.max(0, progressVal - 8); playerProgress.style.width = progressVal + '%'; });
document.getElementById('forwardBtn').addEventListener('click', () => { progressVal = Math.min(100, progressVal + 8); playerProgress.style.width = progressVal + '%'; });
['rewindBtn','forwardBtn'].forEach(id => { const el = document.getElementById(id); el.addEventListener('mouseenter', function(){ Focus.set(this); }); });

// ==================================================================
// SEARCH
// ==================================================================
const searchOverlay = document.getElementById('searchOverlay');
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
let searchTimer = null;

document.getElementById('searchBtn').addEventListener('click', () => {
    searchOverlay.classList.add('open');
    setTimeout(() => searchInput.focus(), 300);
});
document.getElementById('searchBtn').addEventListener('mouseenter', function(){ Focus.set(this); });
document.getElementById('searchClose').addEventListener('click', () => {
    searchOverlay.classList.remove('open');
    searchInput.value = ''; searchResults.innerHTML = '';
    setTimeout(() => { const nav = document.querySelector('.nav-item.active'); if(nav) Focus.set(nav); }, 300);
});
document.getElementById('searchClose').addEventListener('mouseenter', function(){ Focus.set(this); });

searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    const q = searchInput.value.trim();
    if(q.length < 2){ searchResults.innerHTML = ''; return; }
    searchTimer = setTimeout(async () => {
        try {
            const [fmdbResults, tmdbResults] = await Promise.all([
                fmdbSearch(q),
                tmdbFallback(q)
            ]);
            const combined = [...fmdbResults, ...tmdbResults].slice(0, 30);
            searchResults.innerHTML = '';
            combined.forEach(m => searchResults.appendChild(createCard(m)));
            if(combined.length) setTimeout(() => Focus.set(searchResults.querySelector('.tv-card')), 200);
        } catch(e){ console.error(e); }
    }, 400);
});
searchInput.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ const first = searchResults.querySelector('.tv-card'); if(first) Focus.set(first); }
});

// ==================================================================
// PROFILE
// ==================================================================
document.getElementById('profileBtn').addEventListener('click', () => {
    alert('👤 Профиль TV\n\nИсточник данных: FM-DB (imdb.iamidiotareyoutoo.com)\nЛицензия: бесплатно, без ключей');
});
document.getElementById('profileBtn').addEventListener('mouseenter', function(){ Focus.set(this); });

['heroWatch','heroMore'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('mouseenter', () => Focus.set(el));
    el.addEventListener('focus', () => Focus.set(el));
});

// ==================================================================
// SCROLL HEADER
// ==================================================================
document.querySelectorAll('.page').forEach(p => {
    p.addEventListener('scroll', () => {
        document.getElementById('topBar').classList.toggle('scrolled', p.scrollTop > 40);
    });
});

// ==================================================================
// CLICK OUTSIDE
// ==================================================================
document.getElementById('detailScreen').addEventListener('click', e => {
    if(e.target === detailScreen || e.target.classList.contains('detail-hero') || e.target.classList.contains('detail-hero-bg')) closeDetail();
});
document.getElementById('searchOverlay').addEventListener('click', e => { if(e.target === searchOverlay) document.getElementById('searchClose').click(); });

setTimeout(() => { const h = document.querySelector('.hint'); if(h){ h.style.opacity = '0'; h.style.transition = 'opacity 0.5s'; } }, 8000);

})();
</script>
